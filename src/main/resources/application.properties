# ----------------------------------------
# Application Info
# ----------------------------------------
spring.application.name=mappings
server.port=8080

# ----------------------------------------
# Datasource Configuration (MySQL)
# ----------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/hb-01-one-to-one-uni?useSSL=false&serverTimezone=UTC
spring.datasource.username=springstudent
spring.datasource.password=springstudent
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP - default)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariPool-Mappings
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ----------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ----------------------------------------
# Logging Configuration
# ----------------------------------------
logging.level.root=warn
logging.level.org.springframework=info
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# ----------------------------------------
# Banner Configuration
# ----------------------------------------
spring.main.banner-mode=off

# ----------------------------------------
# DevTools (optional for development)
# ----------------------------------------
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ----------------------------------------
# Actuator (optional - monitoring)
# ----------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
